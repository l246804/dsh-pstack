ignoreWorkspaceRootCheck: true
catalogMode: prefer
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade

shellEmulator: true

packages:
  - pstack
  - skills

allowBuilds:
  simple-git-hooks: true

catalogs:
  agentic:
    skills: ^1.7.4
  cli:
    bumpp: ^12.3.0
    typescript: ^7.0.2
    vite: npm:@voidzero-dev/vite-plus-core@1.4.0
    vite-plus: 1.4.0
  types:
    '@types/node': ^24.1.0
    "@deepseek-ai/dsh-agent": "0.2.1-rc.3"
    "@deepseek-ai/dsh-jobs": "0.2.1-rc.3"
    "@deepseek-ai/dsh-llm": "0.2.1-rc.3"
    "@deepseek-ai/dsh-session": "0.2.1-rc.3"
    "@deepseek-ai/dsh-skill": "0.2.1-rc.3"
    "@deepseek-ai/dsh-subagent": "0.2.1-rc.3"
    "@deepseek-ai/dsh-system-prompt": "0.2.1-rc.3"
    "@deepseek-ai/dsh-tools": "0.2.1-rc.3"
    "@deepseek-ai/dsh-working-directory": "0.2.1-rc.3"
  testing:
    js-yaml: ^5.5.0
  inlined:
    commander: 14.0.0

overrides:
  vite@*: "catalog:cli"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
