ignoreWorkspaceRootCheck: true
catalogMode: strict
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade

shellEmulator: true

packages:
  - skills
  - playground
  - native

allowBuilds:
  agent-browser: true
  simple-git-hooks: true

catalogs:
  agentic:
    skills: ^1.7.4
  browser:
    agent-browser: 0.41.2
  cli:
    bumpp: ^12.3.0
    typescript: ^7.0.2
    vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
    vite-plus: 1.8.0
  types:
    "@types/node": ^24.1.0
    "@deepseek-ai/dsh-agent": 0.2.3-alpha.2
    "@deepseek-ai/dsh-agent-instructions": 0.2.3-alpha.2
    "@deepseek-ai/dsh-agent-preset-registry": 0.2.3-alpha.2
    "@deepseek-ai/dsh-agent-team": 0.2.3-alpha.2
    "@deepseek-ai/dsh-api-gateway": 0.2.3-alpha.2
    "@deepseek-ai/dsh-api-remotes": 0.2.3-alpha.2
    "@deepseek-ai/dsh-client-locale": 0.2.3-alpha.2
    "@deepseek-ai/dsh-client-shortcuts": 0.2.3-alpha.2
    "@deepseek-ai/dsh-client-ui-conversation": 0.2.3-alpha.2
    "@deepseek-ai/dsh-client-ui-model-selection": 0.2.3-alpha.2
    "@deepseek-ai/dsh-client-ui-plugin-manager": 0.2.3-alpha.2
    "@deepseek-ai/dsh-client-ui-renderer": 0.2.3-alpha.2
    "@deepseek-ai/dsh-client-ui-settings": 0.2.3-alpha.2
    "@deepseek-ai/dsh-config-editor": 0.2.3-alpha.2
    "@deepseek-ai/dsh-client-ui-slots": 0.2.3-alpha.2
    "@deepseek-ai/dsh-llm": 0.2.3-alpha.2
    "@deepseek-ai/dsh-plugin-manager": 0.2.3-alpha.2
    "@deepseek-ai/dsh-settings": 0.2.3-alpha.2
    "@deepseek-ai/dsh-session": 0.2.3-alpha.2
    "@deepseek-ai/dsh-session-persistence": 0.2.3-alpha.2
    "@deepseek-ai/dsh-session-projection": 0.2.3-alpha.2
    "@deepseek-ai/dsh-skill": 0.2.3-alpha.2
    "@deepseek-ai/dsh-storage-domain": 0.2.3-alpha.2
    "@deepseek-ai/dsh-subagent": 0.2.3-alpha.2
    "@deepseek-ai/dsh-system-prompt": 0.2.3-alpha.2
    "@deepseek-ai/dsh-tool-subagent": 0.2.3-alpha.2
    "@deepseek-ai/dsh-tool-subagent-control": 0.2.3-alpha.2
    "@deepseek-ai/dsh-tools": 0.2.3-alpha.2
    "@deepseek-ai/dsh-typert-registry": 0.2.3-alpha.2
    "@deepseek-ai/dsh-working-directory": 0.2.3-alpha.2
  runtime:
    "@deepseek-ai/cordis": ~4.1.0
    "@deepseek-ai/cordis-plugin-loader": ~1.1.0
    "@deepseek-ai/dsh-client-ui-primitives": 0.2.3-alpha.2
    "@deepseek-ai/dsh-llm": 0.2.3-alpha.2
    "@deepseek-ai/dsh-sandbox-policy": 0.2.3-alpha.2
    "@deepseek-ai/dsh-skill": 0.2.3-alpha.2
    "@deepseek-ai/dsh-typert-protocol": 0.2.3-alpha.2
    "@deepseek-ai/schemastery": ~3.19.0
    "zod": 4.6.6
  ui:
    react: ^18.3.1
    react-dom: ^18.3.1
    "@types/react": ~18.3.1
    "@types/react-dom": ~18.3.0
  testing:
    happy-dom: ^21.0.4
  playground:
    js-yaml: ^5.5.0

overrides:
  vite@*: catalog:cli
trustPolicyExclude:
  - tsrs@7.1.0-beta.tsrs4
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@8.3.8001"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.8.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.8.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.8.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.8.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.8.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.8.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.8.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.8.0"
  - vite-plus@1.8.0
