# Profile-level patch template for the playground. prepare.ts copies this into
# the runtime profile and adds the mode-specific rows on top.
#
# The playground runs a built artifact and HMR watches profile files, which can
# reload or dispose plugins mid startup, so live reload stays disabled.
- id: hmr
  disabled: true
- id: client-hmr
  disabled: true

# Default the playground UI to Simplified Chinese regardless of the browser
# language. Settings → General → Language still overrides it per browser.
- id: locale
  config:
    preference: zh
