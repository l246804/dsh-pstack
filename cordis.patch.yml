# dsh-pstack bundle patch.
#
# Four rows, all installed by this package:
#   - `pstack` mounts the bundled skill provider. Every pstack skill becomes a
#     normal DSH skill: model-invocable skills reach the catalog, user-invocable
#     skills reach the `/` menu.
#   - `pstack-worktree` and `pstack-tool-worktree` mount the DSH worktree
#     service and the `create_worktree` tool. pstack's parallel-writer
#     playbooks require that tool. When the official
#     `@deepseek-ai/dsh-experimental-tool-worktree` bundle is already active,
#     these rows stay disabled and the official rows serve the tool.
#   - `pstack-subagent` mounts the `pstack_subagent` tool, the DSH replacement
#     for Cursor's `Task` tool. It resolves pstack role lines from
#     `~/.dsh/pstack-models.md` and delegates through `ctx.subagents`. Its
#     `maxDepth: 2` cap allows one nested delegation for the orchestrate and
#     feature playbooks; the model cannot raise it.
#
# The `pstack` row requires `ctx.skills`, which `@deepseek-ai/dsh-base` provides.
# The `pstack-subagent` row requires `ctx.tools`, `ctx.subagents`, and `ctx.llm`,
# also in base-backed profiles. Installing this bundle into a profile that
# lacks them leaves the rows pending, exactly like any other dependency-driven
# plugin.
- insert:
    - id: pstack
      name: "dsh-pstack"

    - id: pstack-worktree
      name: "@deepseek-ai/dsh-experimental-worktree"
      disabled: !!js "ctx.get('profileContext')?.startedBundles.includes('@deepseek-ai/dsh-experimental-tool-worktree') ?? false"

    - id: pstack-tool-worktree
      name: "@deepseek-ai/dsh-experimental-tool-worktree"
      disabled: !!js "ctx.get('profileContext')?.startedBundles.includes('@deepseek-ai/dsh-experimental-tool-worktree') ?? false"

    - id: pstack-subagent
      name: "dsh-pstack/subagent"
      config:
        maxDepth: 2
