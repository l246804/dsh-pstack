# Every skill this package ships that is not generated from the pstack submodule.
#
# Two keys, mirroring the two roots. They are separate because their proofs differ:
# a vendored skill is checked against a commit and a per-file hash, and an authored
# skill has no commit to check against because the text here is the source. As a
# field on one list, every check had to branch on it and assert both directions.
#
# A skill listed under the wrong key is caught by check-assets: the path it resolves
# to exists in only one root.

vendored:
  - id: mattpocock-skills
    repository: https://github.com/mattpocock/skills
    license: MIT
    copyright: Copyright (c) 2026 Matt Pocock
    revision: 5beb35b040e3de97e54fa9e386d7e42d15c295c2
    branch: main
    fetched: '2026-10-27'
    skills:
      - name: writing-for-agents
        upstream: skills/productivity/writing-for-agents
        files:
          - SKILL.md
          - SKILL-MECHANICS.md
        note: >-
          Names no IDE, no tool, and no path, so it needs no adaptation and is vendored byte for
          byte.
        hashes:
          SKILL.md: 551adca942227b44192edba88acd4e8db911f0121ce58ad16944ccf6a896a74a
          SKILL-MECHANICS.md: c768e6307c7c10728c401c213f2c4ba71c542127eeb7ad2956aabd15a0fa0059

# Skills written here, for this package's own use.
#
# There is no revision to pin and no upstream to re-fetch, so no hashes and no
# `--remote`. The `files` inventory still applies, and it is the reason to list these
# at all: a file appearing inside one of these skills shows up in review instead of
# shipping as text nobody chose.
#
# They live outside `pstack/` because that tree is regenerated from the submodule and
# asserted to hold only generated files. See
# docs/decisions/2026-10-27-port-directory-layout.md.
#
# Each one declares its own `invocation`, and check-assets asserts the SKILL.md
# frontmatter agrees. There is no blanket rule that a package-authored skill is
# user-invoked: the port holds that shape because upstream declared it, while a skill
# written here picks whichever reach its trigger actually needs.
authored:
  - id: local
    license: MIT
    copyright: Copyright (c) 2026 leiwang
    skills:
      - name: decision-write
        files:
          - SKILL.md
        invocation: model
        note: >-
          Model-invocable. The record has to be written while the change is still in hand, and
          a choice that had a real alternative is the moment a caller is least likely to
          remember a slash command.
      - name: decision-audit
        files:
          - SKILL.md
        invocation: user
        note: >-
          User-invoked. It reports rather than acts, so nothing in a task depends on it firing
          on its own, and keeping it out of the model catalog costs no context.
      - name: setup-project-docs
        files:
          - SKILL.md
        invocation: user
        note: >-
          User-invoked. It is the one skill here that writes to the repository, so a person
          starts it.
