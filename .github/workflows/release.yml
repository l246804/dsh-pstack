name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    uses: sxzz/workflows/.github/workflows/release.yml@main
    with:
      publish: true
      build: |
        git submodule update --init --recursive
        pnpm exec vp run build
    permissions:
      contents: write
      id-token: write
