name: Upstream watch

# Reports pinned upstream sources that have moved past the revision recorded in
# this repository, and opens one issue per drifted source. It stays quiet while
# that issue is open, so a source that keeps moving does not file a new issue
# every day.

on:
  schedule:
    # 01:00 UTC is 09:00 in Asia/Shanghai.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare upstream pins
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/upstream-watch.sh | tee /tmp/stale

      - name: Open an issue per stale source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if grep -qx 'all upstream pins are current' /tmp/stale; then
            echo "nothing stale"
            exit 0
          fi

          gh issue list --state open --limit 200 --json number,title > /tmp/open.json

          while IFS='|' read -r name pinned latest url; do
            [ -n "$name" ] || continue
            title="[upstream] $name 越过 pin"
            existing="$(jq -r --arg t "$title" '.[] | select(.title == $t) | .number' /tmp/open.json | head -1)"
            if [ -n "$existing" ]; then
              echo "issue #$existing already tracks $name"
              continue
            fi

            {
              echo "### Problem（问题）"
              echo
              echo "\`$name\` 的固定版本已经落后于上游。"
              echo
              echo "### Evidence and context（证据与环境）"
              echo
              echo "- 本仓固定：\`$pinned\`"
              echo "- 上游当前：\`$latest\`"
              echo "- 来源：$url"
              echo
              echo "### Impact（影响）"
              echo
              echo "当前适配是否受影响尚未评估，需要先确认上游差异，再决定是否升级。"
              echo
              echo "### What this does not cover（不在范围内）"
              echo
              echo "不判断改动的影响面，也不给出处理步骤。"
            } > /tmp/issue-body.md

            gh issue create --title "$title" --label enhancement --body-file /tmp/issue-body.md
          done < /tmp/stale
