name: Change request（改动与功能请求）
description: Describe a problem or improvement（描述问题或改进诉求）
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem, evidence, and impact. Brief improvement suggestions are welcome.
        描述问题、证据和影响，也欢迎简要提出改进建议。
  - type: textarea
    id: problem
    attributes:
      label: Problem（问题）
      description: What is hard today, and who hits it. 现在哪里难用，谁会遇到。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Evidence and context（证据与环境）
      description: Include versions, the command or session, and reproducible observations. 附版本、命令或会话，以及可复查的现象。
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact（影响）
      description: Who is affected, and what is blocked or harder to do. 谁受影响，什么操作受阻或变得困难。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement（改进建议）
      description: Optional. Briefly describe a useful improvement and why; distinguish assumptions from verified facts. 可选，简述改进方向和依据，区分推测与已验证事实。
    validations:
      required: false
  - type: textarea
    id: not-covered
    attributes:
      label: What this does not cover（不在范围内）
      description: Optional. Keep the request bounded. 可选，把请求限定住。
    validations:
      required: false
