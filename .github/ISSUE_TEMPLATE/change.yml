name: Change request（改动与功能请求）
description: A problem to discuss, not a finished design（先讨论问题，不写成品设计）
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the observed problem, evidence, and impact. Discuss solutions after the problem is agreed on.
        描述观察到的问题、证据和影响，方案在问题确认之后再谈。
  - type: textarea
    id: problem
    attributes:
      label: Problem（问题）
      description: What is hard today, and who hits it. 现在哪里难用，谁会遇到。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Evidence and context（证据与环境）
      description: Include versions, the command or session, and reproducible observations. 附版本、命令或会话，以及可复查的现象。
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact（影响）
      description: Who is affected, and what is blocked or harder to do. 谁受影响，什么操作受阻或变得困难。
    validations:
      required: true
  - type: textarea
    id: not-covered
    attributes:
      label: What this does not cover（不在范围内）
      description: Optional. Keep the request bounded. 可选，把请求限定住。
    validations:
      required: false
